grf:
  grfid: brtf
  short_name: OpenTTE2
  name: Thomas The Tank Engine add-on for BRTrains
  description: A Thomas the Tank Engine and Friends add-on for BRTrains

versioning:
  version: 1
  compatible_version: 1

defaults:
  vehicle:
    type: TRAIN
  sprites:
    include_2x: true
    include_32bpp: true

# The purchase list is ordered by hand rather than by a derived rule: the NWR characters
# come first in their number order, then the engines with no number by power, then the
# coaches and wagons. The block names the generated item symbols, so BRBuild runs
# tools/generate_sortpurchase.py, which builds the list from the items this build produced;
# BRBuild compiles what it returns and stores it in WorkingData, so no list is kept here.
purchase_list:
  script: tools/generate_sortpurchase.py

params:
  - identifier: param_speed_mode
    name_str: Speed Mode
    desc_str: Use each unit's design speed, or its permitted service speed
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Service Speed
      1: Design Speed

  - identifier: Longer_tank_engines
    name_str: Longer Tank Engines
    desc_str: switch between BRtrains Scaling or generic scaling
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: BRtrains Scale
      1: Generic

  - identifier: param_resolution
    name_str: Use 2x resolution sprites?
    desc_str: Used to improve face details, the vehicles are still rendered at 1x.
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: 1x (Default OpenTTD resolution)
      1: 2x (Higher resolution, better for faces)

  - identifier: param_capacity_scaling
    name_str: Capacity Scaling
    desc_str: Scale vehicle capacities
    min_value: 1
    max_value: 4
    def_value: 1
    names:
      1: 1x
      2: 2x
      3: 3x
      4: 4x
  - identifier: param_mail_multiplier
    name_str: Mail Capacity Multiplier
    desc_str: Increase capacities of mail vehicles
    min_value: 1
    max_value: 4
    def_value: 1
    names:
      1: 1x
      2: 2x
      3: 3x
      4: 4x 
  - identifier: param_freight_multiplier
    name_str: Freight Capacity Multiplier
    desc_str: Increase capacities of freight wagons etc
    min_value: 1
    max_value: 4
    def_value: 1
    names:
      1: 1x
      2: 2x
      3: 3x
      4: 4x 

  - identifier: param_running_cost_factor
    name_str: Running Cost Multiplier
    desc_str: Adjust the running costs of all vehicles
    min_value: 1
    max_value: 9
    def_value: 3
    names:
      1: Tiny (--)
      2: Reduced (-)
      3: Normal (Default)
      4: Increased (+)
      5: High (++)
      6: Expensive (+++)
      7: Excessive (++++)
      8: Monstrous (+++++)
      9: Ridiculous (++++++)

  - identifier: param_purchase_cost_factor
    name_str: Purchase Cost Multiplier
    desc_str: Adjust the purchase costs of all vehicles
    min_value: 1
    max_value: 9
    def_value: 3
    names:
      1: Tiny (--)
      2: Reduced (-)
      3: Normal (Default)
      4: Increased (+)
      5: High (++)
      6: Expensive (+++)
      7: Excessive (++++)
      8: Monstrous (+++++)
      9: Ridiculous (++++++)

  - identifier: param_disable_default_vehicles
    name_str: Hide Default OpenTTD vehicles?
    desc_str: Hide the default OpenTTD vehicles from the vehicle list
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Show Default OpenTTD vehicles
      1: Hide Default OpenTTD vehicles

  - identifier: param_sounds
    name_str: Sounds
    desc_str: Enable or disable vehicle sounds
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Sounds Off
      1: Sounds On
  - identifier: param_faces
    name_str: Face override
    desc_str: Enable or disable the Fat Controller's face as the company owner
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Fat Controller Face Off
      1: Fat Controller Face On

global_actions:
  - condition: param_disable_default_vehicles == 1
    action: disable_item(FEAT_TRAINS)
